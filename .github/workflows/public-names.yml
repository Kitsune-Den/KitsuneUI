# Other mods build on KitsuneUI's public names, so a rename fails here before it merges.
# The other release checks need the game's files, so they run locally: tools/check_release.py.
name: Public names

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_public_names.py
