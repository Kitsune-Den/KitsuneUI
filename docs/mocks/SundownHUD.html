<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sundown HUD</title>
<!-- A mock of KitsuneUI_Sundown 0.2 at 1920x1080, laid out from the patched XUi (x and y are
     window pixels). The scene, the map and the icons are drawn here, not taken from the game.
     The game only has its own font, so the mock uses a plain sans for everything. -->
<style>
  :root {
    --pink: rgb(255,105,170); --lav: rgb(170,150,235); --teal: rgb(80,230,200);
    --text: rgb(246,244,250); --muted: rgb(175,170,195);
    --card: rgba(28,26,42,.88); --card2: rgba(42,40,60,.92); --track: rgba(16,14,26,.62);
    --health: rgb(238,140,185); --stamina: rgb(150,128,236); --food: rgb(255,196,96); --water: rgb(96,206,250);
  }
  html, body { margin: 0; height: 100%; background: #08070d; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font: 600 16px "Segoe UI", Arial, sans-serif; color: var(--text);
    background: linear-gradient(180deg, #1d1a3f 0%, #4b2a63 30%, #b04f7e 50%, #f08a6e 60%, #2a1c30 60.2%, #120d18 100%); }
  .abs { position: absolute; }
  .o { text-shadow: 0 0 2px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.6); }
  .badge { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: rgba(16,14,26,.78); }
  .badge i { position: absolute; left: 5px; top: 5px; width: 8px; height: 8px; border-radius: 2px; background: rgb(205,200,220); }
  .bar { position: absolute; height: 8px; background: var(--track); }
  .bar i { display: block; height: 100%; }
  .card { position: absolute; background: var(--card); border-radius: 10px; }
  .glyph { display: inline-block; width: 26px; height: 26px; line-height: 26px; border-radius: 50%; background: var(--text); color: #15131f; font-size: 15px; text-align: center; font-weight: 800; margin-right: 8px; vertical-align: middle; }
  .slot { position: absolute; bottom: 16px; width: 64px; height: 64px; background: rgba(24,22,36,.72); border-radius: 4px; box-sizing: border-box; }
  .slot.on { background: rgba(246,244,250,.9); }
  .slot b { position: absolute; left: 5px; top: 3px; font-size: 12px; color: var(--muted); }
  .slot.on b { color: #15131f; }
  .slot u { position: absolute; left: 18px; top: 18px; width: 28px; height: 28px; border-radius: 4px; background: rgb(190,185,210); text-decoration: none; }
  .slot.on u { background: #2a2738; }
  .lbl { color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .note { position: absolute; font: 500 13px "Segoe UI", Arial, sans-serif; color: rgba(255,255,255,.55); }
</style>
</head>
<body>
<div id="stage">

  <!-- ===== Top left: thin vitals, a dark badge for each icon (HUDLeftStatBars, anchored top left) ===== -->
  <div class="badge" style="left:24px; top:24px"><i style="background:var(--health)"></i></div>
  <div class="bar" style="left:48px; top:29px; width:180px"><i style="width:72%; background:var(--health)"></i></div>
  <div class="badge" style="left:24px; top:46px"><i></i></div>
  <div class="bar" style="left:48px; top:51px; width:180px"><i style="width:88%; background:var(--stamina)"></i></div>
  <div class="badge" style="left:24px; top:68px"><i></i></div>
  <div class="bar" style="left:48px; top:73px; width:180px"><i style="width:64%; background:var(--food)"></i></div>
  <div class="badge" style="left:24px; top:90px"><i></i></div>
  <div class="bar" style="left:48px; top:95px; width:180px"><i style="width:91%; background:var(--water)"></i></div>
  <!-- stealth: only while crouched -->
  <div class="badge" style="left:24px; top:112px"><i></i></div>
  <div class="bar" style="left:48px; top:117px; width:180px"><i style="width:22%; background:var(--text)"></i></div>

  <!-- Crafting: a toast, ring round the icon -->
  <div class="card" style="left:24px; top:150px; width:270px; height:60px"></div>
  <svg class="abs" style="left:32px; top:156px" width="48" height="48" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(80,230,200,.22)" stroke-width="4"/>
    <circle cx="24" cy="24" r="20" fill="none" stroke="rgb(80,230,200)" stroke-width="4" pathLength="100" stroke-dasharray="38 100" transform="rotate(-90 24 24)"/>
    <rect x="15" y="15" width="18" height="18" rx="3" fill="rgb(205,200,220)"/>
  </svg>
  <div class="abs" style="left:90px; top:158px; font-size:19px; font-weight:700">Forged Iron x6</div>
  <div class="abs" style="left:90px; top:183px; font-size:17px; color:var(--muted)">0:12</div>

  <!-- ===== Top centre: the compass as a strip, no plate ===== -->
  <div class="abs" style="left:770px; top:40px; width:380px; height:1px; background:rgba(246,244,250,.35)"></div>
  <div class="abs o" style="left:770px; top:46px; width:380px; display:flex; justify-content:space-between; font-size:16px; color:var(--muted)">
    <span>W</span><span>·</span><span>NW</span><span>·</span><span style="color:var(--text)">N</span><span>·</span><span>NE</span><span>·</span><span>E</span></div>
  <svg class="abs" style="left:949px; top:20px" width="22" height="22" viewBox="0 0 22 22">
    <circle cx="11" cy="11" r="11" fill="rgb(246,244,250)"/><path d="M11 5 l5 11 -5 -3 -5 3z" fill="#15131f"/></svg>
  <!-- a quest marker riding the strip, and how far -->
  <svg class="abs" style="left:1046px; top:28px" width="26" height="26" viewBox="0 0 26 26">
    <circle cx="13" cy="13" r="11" fill="none" stroke="rgb(80,230,200)" stroke-width="2.5" stroke-dasharray="6 3.5"/>
    <circle cx="13" cy="13" r="7" fill="var(--pink)"/></svg>
  <div class="abs o" style="left:1009px; top:58px; width:100px; text-align:center; font-size:20px; font-weight:800">412 m</div>
  <div class="abs o" style="left:0; width:1920px; top:84px; text-align:center; font-size:20px; font-weight:700; letter-spacing:.04em">DAY 12 &nbsp; 19:42</div>
  <div class="abs o" style="left:0; width:1920px; top:110px; text-align:center; font-size:16px; font-weight:700; letter-spacing:.06em; color:var(--pink)">HORDE IN 2 DAYS</div>

  <!-- ===== Top right: rounds, then the weapon (ActiveItem moved up) ===== -->
  <div class="abs o" style="right:24px; top:22px; font-size:28px; font-weight:800; letter-spacing:.02em">17 <span style="color:var(--muted)">80</span></div>
  <div class="abs" style="right:24px; top:62px; width:64px; height:24px; background:rgb(205,200,220); clip-path:polygon(0 30%,70% 30%,70% 0,100% 0,100% 55%,40% 55%,32% 100%,14% 100%,18% 55%,0 55%)"></div>

  <!-- Quest tracker: a card with the lavender top line -->
  <div class="abs" style="right:24px; top:110px; width:300px; height:3px; background:var(--lav); border-radius:2px 2px 0 0"></div>
  <div class="abs" style="right:24px; top:113px; width:300px; height:36px; background:var(--card2)"></div>
  <div class="abs lbl" style="right:24px; width:286px; top:122px">Clear the barn</div>
  <div class="abs" style="right:24px; top:149px; width:300px; height:62px; background:var(--card); border-radius:0 0 6px 6px"></div>
  <div class="abs" style="right:24px; width:286px; top:156px; font-size:18px; font-weight:700">Kill the zombies</div>
  <div class="abs" style="right:24px; width:286px; top:181px; font-size:16px; color:var(--lav)">3 / 8</div>

  <!-- ===== Bottom left: the map, rounded indigo glass, the reading inside its corner ===== -->
  <div class="abs" style="left:24px; bottom:24px; width:200px; height:200px; border-radius:14px; overflow:hidden; background:rgba(34,30,70,.82); border:1px solid rgba(190,180,240,.28); box-sizing:border-box">
    <svg width="200" height="200" viewBox="0 0 200 200" fill="none">
      <rect x="8" y="8" width="184" height="184" rx="8" fill="#2c2a5a"/>
      <path d="M8 120 C60 110 80 150 130 118 S180 90 192 96 L192 192 L8 192z" fill="#24224c"/>
      <path d="M70 8 C84 60 64 90 100 100" stroke="#8f8ab8" stroke-opacity=".7" stroke-width="5"/>
      <path d="M8 150 C70 140 120 150 192 132" stroke="#8f8ab8" stroke-opacity=".7" stroke-width="5"/>
      <path d="M100 100 L120 76 L140 40" stroke="rgb(80,230,200)" stroke-width="7" stroke-dasharray="9 3"/>
      <circle cx="100" cy="100" r="12" fill="rgba(16,14,26,.85)"/>
      <path d="M100 92 l6 13 -6 -4 -6 4z" fill="#fff"/>
      <circle cx="48" cy="72" r="5" fill="rgb(96,206,250)"/>
    </svg>
    <div class="abs o" style="left:14px; top:12px; font-size:14px; font-weight:800">1204 E &nbsp;688 N</div>
    <div class="abs o" style="left:94px; bottom:6px; width:12px; text-align:center; font-size:14px; font-weight:800">N</div>
  </div>
  <!-- a marker hanging over the map's top edge -->
  <svg class="abs" style="left:150px; bottom:210px" width="28" height="28" viewBox="0 0 28 28">
    <circle cx="14" cy="14" r="12" fill="none" stroke="rgb(80,230,200)" stroke-width="2.5" stroke-dasharray="6 3.5"/>
    <circle cx="14" cy="14" r="8" fill="var(--pink)"/></svg>

  <!-- Buff toasts, stacking up from just above the map -->
  <div class="card" style="left:24px; bottom:248px; width:250px; height:54px"></div>
  <svg class="abs" style="left:31px; bottom:255px" width="40" height="40" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="16.5" fill="none" stroke="rgb(80,230,200)" stroke-width="3.5" pathLength="100" stroke-dasharray="93 7" transform="rotate(-80 20 20)"/>
    <path d="M21 9 l-7 12 h6 l-2 10 8 -13 h-6z" fill="rgb(80,230,200)"/></svg>
  <div class="abs" style="left:80px; bottom:271px; font-size:18px; font-weight:700">Well Fed</div>
  <div class="abs" style="left:80px; bottom:252px; font-size:15px; color:var(--muted)">+5%</div>

  <!-- ===== Bottom right: vehicle fuel and health, the same thin bars ===== -->
  <div class="badge" style="right:206px; bottom:52px"><i></i></div>
  <div class="bar" style="right:24px; bottom:57px; width:176px"><i style="width:58%; background:var(--food)"></i></div>
  <div class="badge" style="right:206px; bottom:30px"><i style="background:var(--health)"></i></div>
  <div class="bar" style="right:24px; bottom:35px; width:176px"><i style="width:83%; background:var(--health)"></i></div>

  <!-- ===== Centre: the use prompt, a round key and a caps verb, no plate ===== -->
  <div class="abs o" style="left:1000px; top:600px; font-size:20px; font-weight:800; letter-spacing:.05em"><span class="glyph">E</span>SEARCH CUPBOARD</div>
  <!-- block health as a thin ring on the crosshair -->
  <svg class="abs" style="left:928px; top:508px" width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(16,14,26,.55)" stroke-width="2.5"/>
    <circle cx="32" cy="32" r="30" fill="none" stroke="rgb(246,244,250)" stroke-width="2.5" pathLength="100" stroke-dasharray="64 100" transform="rotate(-90 32 32)"/>
    <circle cx="32" cy="32" r="2" fill="#fff"/></svg>

  <!-- Help text: the plain charcoal box, keyword in bold -->
  <div class="abs" style="left:24px; top:236px; width:330px; padding:12px 16px; background:rgba(40,38,48,.9); border-radius:3px; font-weight:400; font-size:17px; line-height:24px">
    <b>Bedroll</b> sets where you come back after you die.</div>

  <!-- ===== Toolbelt: flat dark tiles, the held one white ===== -->
  <div class="slot" style="left:629px"><b>1</b><u></u></div><div class="slot" style="left:695px"><b>2</b><u></u></div>
  <div class="slot on" style="left:761px"><b>3</b><u></u></div><div class="slot" style="left:827px"><b>4</b><u></u></div>
  <div class="slot" style="left:893px"><b>5</b><u></u></div><div class="slot" style="left:959px"><b>6</b><u></u></div>
  <div class="slot" style="left:1025px"><b>7</b><u></u></div><div class="slot" style="left:1091px"><b>8</b><u></u></div>
  <div class="slot" style="left:1157px"><b>9</b><u></u></div><div class="slot" style="left:1223px"><b>0</b><u></u></div>

  <div class="note" style="right:24px; bottom:96px">Mock. Things the game shows only some of the time are all up at once.</div>
</div>
<script>
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.getElementById("stage").style.transform = "scale(" + s + ")";
  }
  addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
