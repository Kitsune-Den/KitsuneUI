<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trader jobs as tiles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#6FE3FF}a:hover{color:#B5F1FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1600px; height: 900px; position: relative; overflow: hidden; font-family: 'Barlow Semi Condensed', sans-serif; color: #E8ECF7; background: radial-gradient(ellipse at 50% 35%, #4A3626 0%, #2A1E14 45%, #120C08 100%)">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; height: 160px; background: repeating-linear-gradient(90deg, rgba(110,78,50,0.4) 0 160px, rgba(70,48,30,0.4) 160px 168px)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 230px; right: 0; height: 14px; background: rgba(60,40,26,0.8)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 380px; right: 0; height: 14px; background: rgba(60,40,26,0.8)"></div>
<div aria-hidden="true" style="position: absolute; left: 640px; top: 90px; width: 320px; height: 560px; border-radius: 160px 160px 40px 40px; background: linear-gradient(180deg, rgba(150,96,70,0.55) 0%, rgba(96,62,46,0.45) 40%, rgba(70,82,110,0.5) 60%, rgba(50,60,84,0.5) 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: 720px; top: 60px; width: 160px; height: 170px; border-radius: 80px; background: linear-gradient(180deg, rgba(180,130,100,0.6), rgba(150,100,80,0.5))"></div>

<div style="position: absolute; left: 40px; top: 452px; display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 6px rgba(0,0,0,0.9)">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v10H9l-5 4z"></path></svg>
<span style="font-size: 24px; font-weight: 700; color: #D9B873">Trader Rekt</span>
<span style="font-size: 17px; color: #C3CAE0">Watch yourself, stranger. Got work if you want it.</span>
</div>

<div role="list" aria-label="Jobs" style="position: absolute; left: 40px; top: 494px; width: 1520px; display: flex; gap: 10px; align-items: flex-end">
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="7">
<div role="listitem" style="width: 186px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px; transform: {{j.lift}}">
<div style="height: 34px; box-sizing: border-box; padding: 0 9px; display: flex; align-items: center; border-radius: 9px; background: {{j.textBg}}; border: 1px solid {{j.textEdge}}; font-size: 15px; white-space: nowrap; overflow: hidden; color: {{j.textColor}}">{{j.head}}</div>
<div style="position: relative; width: 186px; height: 140px; border-radius: 10px; overflow: hidden; border: 1px solid {{j.imgEdge}}; box-shadow: {{j.glow}}">
<img src="{{j.img}}" alt="Preview of {{j.name}}" style="width: 186px; height: 140px; object-fit: cover; display: block">
<span style="position: absolute; left: 6px; top: 6px; height: 22px; padding: 0 7px; display: inline-flex; align-items: center; gap: 4px; border-radius: 11px; background: rgba(12,14,30,0.82); border: 1px solid rgba(217,184,115,0.55); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #D9B873"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FF8A7A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7v3l2 2v3h3v-2h4v2h3v-3l2-2v-3a7 7 0 0 0-7-7z M9 11h.01 M15 11h.01"></path></svg>{{j.tier}}</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 7px; background: linear-gradient(180deg, rgba(8,10,22,0) 0%, rgba(8,10,22,0.88) 70%); font-size: 16px; font-weight: 700; line-height: 1.1; color: #F2F5FC">{{j.name}}</div>
</div>
</div>
</sc-for>
<button style="width: 110px; height: 34px; flex-shrink: 0; margin-bottom: 145px; border-radius: 9px; border: 1px solid rgba(150,175,255,0.22); background: linear-gradient(180deg, rgba(28,33,62,0.92), rgba(12,14,30,0.9)); color: #C3CAE0; font-size: 16px; font-weight: 600; cursor: pointer">Nevermind.</button>
</div>

<section aria-label="Toolbelt" style="position: absolute; left: 471px; top: 726px; width: 658px; height: 146px; box-sizing: border-box; padding: 12px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; border-radius: 14px; background: linear-gradient(180deg, rgba(28,33,62,0.94), rgba(12,14,30,0.92)); border: 1px solid rgba(150,175,255,0.16); box-shadow: 0 18px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(217,184,115,0.35)">
<sc-for list="{{belt}}" as="s" hint-placeholder-count="20">
<div style="width: 58px; height: 58px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{s.bc}}; background: rgba(6,8,20,0.6); box-shadow: {{s.ring}}"></div>
</sc-for>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6FE3FF","options":["#6FE3FF","#FF7A59","#D9B873","#B48CFF"]},"hovered":{"editor":"int","default":1,"min":0,"max":6},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6FE3FF';
    const hovered = this.props.hovered ?? 1;
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    const data = [
      ['Fetch (317 m SE)', 'Mercy Point Camp', '/_blob/9a6c0ed2c4f64cebef354dab02da9830'],
      ['Clear Zombies (399 m W)', 'Hook, Line, & Sinker', '/_blob/1ca564888c61bc5c60764bdf26090fff'],
      ['Clear Zombies (428 m W)', "Skeeter's Place", '/_blob/1ab946726c085449283fea8181572602'],
      ['Clear Zombies (1.0 km W)', 'Abandoned Shady Shed Farms', '/_blob/4c762f1fe1552d2dbd1ba5ac5fe5a745'],
      ['Fetch (2.1 km W)', 'New Life Hope Cabin', '/_blob/900e9e5cace12c37f69add5f76ae082a'],
      ['Fetch (2.1 km W)', 'Camp Carwhal', '/_blob/570a0ebeef840c4d787cfcb1d682b354'],
      ['Fetch (2.1 km W)', 'Ranger Station Delta', '/_blob/a821f37438321b71549721ebfa4ed99b']
    ];
    const jobs = data.map((d, i) => {
      const on = i === hovered;
      return {
        head: d[0], name: d[1], img: d[2], tier: 'TIER I',
        lift: on ? 'translateY(-8px)' : 'none',
        textBg: on ? 'rgba(30,84,118,0.95)' : 'linear-gradient(180deg, rgba(28,33,62,0.92), rgba(12,14,30,0.9))',
        textEdge: on ? accent : 'rgba(150,175,255,0.18)',
        textColor: on ? '#F2F5FC' : '#C9D3EE',
        imgEdge: on ? accent : 'rgba(150,175,255,0.22)',
        glow: on ? '0 0 0 1px ' + accent + ', 0 0 22px ' + rgba(accent, 0.45) : '0 8px 20px rgba(0,0,0,0.5)'
      };
    });
    const belt = Array.from({ length: 20 }, (_, i) => ({
      bc: i === 11 ? accent : 'rgba(150,175,255,0.14)',
      ring: i === 11 ? '0 0 14px ' + rgba(accent, 0.45) : 'none'
    }));
    return { accent, jobs, belt };
  }
}
</script>
</body>
</html>
