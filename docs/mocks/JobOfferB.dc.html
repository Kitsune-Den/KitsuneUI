<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job offer, banner preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#6FE3FF}a:hover{color:#B5F1FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1200px; height: 760px; position: relative; overflow: hidden; font-family: 'Barlow Semi Condensed', sans-serif; color: #E8ECF7; background: radial-gradient(ellipse at 50% 40%, #3A2A1E 0%, #22180F 45%, #0E0A08 100%)">

<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; height: 120px; background: repeating-linear-gradient(90deg, rgba(90,62,40,0.35) 0 140px, rgba(60,40,26,0.35) 140px 146px)"></div>
<div aria-hidden="true" style="position: absolute; left: 0; bottom: 0; right: 0; height: 200px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 100%)"></div>

<section aria-label="Job offer" style="position: absolute; left: 290px; top: 70px; width: 620px; border-radius: 16px; background: linear-gradient(180deg, rgba(28,33,62,{{gA}}) 0%, rgba(12,14,30,{{gB}}) 100%); border: 1px solid rgba(150,175,255,0.16); box-shadow: 0 26px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(217,184,115,0.35); overflow: hidden">

<header style="height: 54px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(217,184,115,0.45)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 9-9 9-9-9z M12 8v5 M12 16h.01"></path></svg>
<h2 style="margin: 0; font-size: 26px; font-weight: 700; color: #D9B873">Tier 1 Clear</h2>
<div style="flex: 1"></div>
<span style="height: 30px; padding: 0 12px; display: inline-flex; align-items: center; border-radius: 15px; border: 1px solid rgba(217,184,115,0.5); font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: #D9B873">+1 TIER POINTS</span>
</header>

<figure style="margin: 16px 16px 0; position: relative; height: 250px; border-radius: 12px; overflow: hidden; border: 1px solid {{accentEdge}}; box-shadow: 0 0 18px {{accentGlow}}">
<img src="/_blob/1ca564888c61bc5c60764bdf26090fff" alt="Preview of Hook, Line, &amp; Sinker" style="width: 100%; height: 250px; object-fit: cover; object-position: 50% 60%; display: block">
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 14px 12px; display: flex; align-items: flex-end; gap: 10px; background: linear-gradient(180deg, rgba(8,10,22,0) 0%, rgba(8,10,22,0.9) 75%)">
<figcaption style="flex: 1; font-size: 24px; font-weight: 700; line-height: 1.1; color: #F2F5FC">Hook, Line, &amp; Sinker</figcaption>
<span style="height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 14px; background: rgba(12,14,30,0.75); border: 1px solid rgba(150,175,255,0.22); font-size: 15px; font-weight: 600; color: #C3CAE0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF8A7A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a7 7 0 0 0-7 7v3l2 2v3h3v-2h4v2h3v-3l2-2v-3a7 7 0 0 0-7-7z M9 11h.01 M15 11h.01"></path></svg>Tier 1</span>
<span style="height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 14px; background: rgba(12,14,30,0.75); border: 1px solid rgba(150,175,255,0.22); font-size: 15px; font-weight: 600; color: #C3CAE0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l4 9h-8z M12 21v-9"></path></svg>399 m W</span>
<span style="height: 28px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 14px; background: rgba(12,14,30,0.75); border: 1px solid rgba(150,175,255,0.22); font-size: 15px; font-weight: 600; color: #C3CAE0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9BD36A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l6 9h-4l4 6H6l4-6H6z M12 18v3"></path></svg>Pine Forest</span>
</div>
</figure>

<p style="margin: 16px 18px 0; font-size: 20px; line-height: 1.4; color: #E8ECF7">Go prove that you have what it takes to be a part of White River Runners. We need you to clear out the zombies at <b style="color: #D9B873">Hook, Line, &amp; Sinker</b>.</p>

<div style="padding: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button style="height: 48px; border-radius: 12px; border: 1px solid rgba(111,210,102,0.45); background: rgba(34,92,52,0.9); color: #F2F5FC; font-size: 20px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A6E69B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Accept</button>
<button style="height: 48px; border-radius: 12px; border: 1px solid rgba(255,107,90,0.45); background: rgba(104,30,36,0.9); color: #F2F5FC; font-size: 20px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFA89C" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg>Decline</button>
</div>
</section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#6FE3FF","options":["#6FE3FF","#FF7A59","#D9B873","#B48CFF"]},"glassOpacity":{"editor":"range","default":0.94,"min":0.6,"max":0.99,"step":0.01},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#6FE3FF';
    const op = this.props.glassOpacity ?? 0.94;
    const rgba = (hex, a) => {
      const n = parseInt(hex.slice(1), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    };
    return {
      accent,
      accentEdge: rgba(accent, 0.55),
      accentGlow: rgba(accent, 0.22),
      gA: op.toFixed(2),
      gB: Math.min(1, op - 0.03).toFixed(2)
    };
  }
}
</script>
</body>
</html>
